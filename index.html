<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu de Survie 2D - Ultime Édition (Admin & Zombies)</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// --- CORRECTIF DE COMPATIBILITÉ (ANTI ÉCRAN NOIR) ---
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = r || 0; this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); return this;
  };
}

const canvas = document.getElementById('gameCanvas');
let ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

// --- VARIABLES GLOBALES ET ETATS ---
let gameState = 'lobby';
let money = 0, totalXP = 0, savedColor = '#4ade80';
let upgrades = { speed: 0, hp: 0, baseHP: 0, damage: 0, shotgunLevel: 0, rocketLevel: 0, turretLevel: 0, mineLevel: 0 };
let runStats = { shots: 0, hits: 0, kills: 0, crits: 0 };
let runPerks = { vampirism: 0, piercing: 0, explosive: 0 };
// CORRECTIF : clés de sauvegarde identiques au chargement et à l'achat
const UPKEYS = { speed: 'upSpeed', hp: 'upHp', baseHP: 'upBaseHp', damage: 'upDamage', shotgunLevel: 'upShotgunLevel', rocketLevel: 'upRocketLevel' };

try {
  money = parseInt(localStorage.getItem('survivalMoney')) || 0;
  totalXP = parseInt(localStorage.getItem('survivalXP')) || 0;
  let rawColor = localStorage.getItem('playerColor'); if (rawColor) savedColor = rawColor;
  for (let k in UPKEYS) upgrades[k] = parseInt(localStorage.getItem(UPKEYS[k])) || 0;
} catch(e) {}

const CLASSES = {
  '#4ade80': { name: 'ÉCLAIREUR', boost: 'BOOST: Vitesse + & Dash', spd: 1.3, hp: 0.8, dash: 45, dmg: 1.0, desc: 'Vitesse ++ | Dash rapide | Santé -' },
  '#f87171': { name: 'TANK', boost: 'BOOST: Santé Max & Renvoi', spd: 0.85, hp: 1.5, dash: 120, dmg: 1.0, desc: 'Santé ++ | Épines (Renvoi) | Vitesse -' },
  '#22d3ee': { name: 'INGÉNIEUR', boost: 'BOOST: Dégâts + & Soin Base', spd: 1.0, hp: 1.0, dash: 80, dmg: 1.15, desc: 'Soin Passif Base | Dégâts + | Équilibré' }
};
if (!CLASSES[savedColor]) savedColor = '#4ade80';

const MAX_LEVEL = 300;
function getXPForLevel(level) { return 1000 + (level - 1) * 150; }
function getLevelInfo() {
  let lvl = 1; let remXP = totalXP;
  while (lvl < MAX_LEVEL) { let req = getXPForLevel(lvl); if (remXP >= req) { remXP -= req; lvl++; } else break; }
  return { level: lvl, currentXP: remXP, requiredXP: getXPForLevel(lvl) };
}

let player = { x: canvas.width/2, y: canvas.height/2+120, radius: 15, baseSpeed: 3.5, baseHp: 100, color: savedColor, hp: 100, dashCooldown: 0, isDashing: false, dashTimer: 0, shieldTimer: 0, currentWeapon: 'pistol', recoil: 0, walkCycle: 0 };
let baseCentral = { x: 0, y: 0, w: 90, h: 90, hp: 500, maxHp: 500 };
let currentDimension = 1, globalTime = 0, frameCount = 0;
let portal = { active: false, x: 0, y: 0, radius: 55, targetDim: 2 };

let keys = {}, mouse = { x: 0, y: 0 };
let bullets = [], enemyBullets = [], enemies = [], powerups = [], turrets = [], mines = [], barrels = [], particles = [], floatingTexts = [];
let score = 0, currentWave = 1, maxWaves = 15, waveTimer = 0, enemiesSpawnedInWave = 0, enemiesTotalInWave = 4, waveInProgress = true, activeBoss = null, currentRewards = [];
let buildings = [], scenery = [];
let lobbyParticles = [], endParticles = [], endGameTime = 0, dimFlashAlpha = 0;
let shakeTimer = 0, shakeIntensity = 0;
let comboCount = 0, comboTimer = 0;
let sandboxMode = 'spawn', sandboxTool = 'normal'; // Mode Admin
let enemyIdCounter = 0, bulletIdCounter = 0;
let worldCache = { canvas: document.createElement('canvas'), key: '' }, worldVersion = 0; // cache du décor

function initLobbyParticles() {
  lobbyParticles = [];
  for (let i = 0; i < 45; i++) {
    lobbyParticles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      speedX: (Math.random() - 0.5) * 0.8, speedY: Math.random() * 2 + 0.5,
      radius: Math.random() * 3 + 1, color: Math.random() > 0.5 ? '#38bdf8' : '#c084fc', alpha: Math.random() * 0.5 + 0.2
    });
  }
}
initLobbyParticles();

function getMultiplier() {
  if (comboCount >= 25) return 4.0;
  if (comboCount >= 10) return 2.0;
  if (comboCount >= 3) return 1.5;
  return 1.0;
}

function addKillToCombo() {
  comboCount++;
  comboTimer = 150;
}

function spawnEndParticles(state) {
  endParticles = [];
  for (let i = 0; i < 80; i++) {
    endParticles.push({
      x: Math.random() * canvas.width,
      y: state === 'victory' ? -Math.random() * canvas.height : canvas.height + Math.random() * canvas.height,
      speedX: (Math.random() - 0.5) * 4, speedY: state === 'victory' ? Math.random() * 4 + 2 : -(Math.random() * 4 + 2),
      radius: Math.random() * 6 + 2,
      color: state === 'victory' ? (Math.random() > 0.5 ? '#facc15' : '#4ade80') : (Math.random() > 0.5 ? '#ef4444' : '#7f1d1d'),
      alpha: 1, rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.2
    });
  }
}

function getBaseMaxHp() { if(gameState==='admin_sandbox') return 999999; return (500 + upgrades.baseHP * 250) * (currentDimension===3 ? 2.5 : (currentDimension===2 ? 1.5 : 1)); }
function getPlayerSpeed() { return (player.baseSpeed + (upgrades.speed * 0.4)) * (CLASSES[player.color].spd || 1); }
function getPlayerMaxHp() { if(gameState==='admin_sandbox') return 999999; return Math.round((100 + upgrades.hp * 25) * (CLASSES[player.color].hp || 1)); }
function triggerShake(i, d) { shakeIntensity = i; shakeTimer = d; }
function addFloatingText(x, y, text, color, isCrit = false) { floatingTexts.push({ x: x+(Math.random()-0.5)*20, y: y+(Math.random()-0.5)*20, text: text, color: color, life: 40, dy: -1-Math.random(), isCrit: isCrit }); }

// --- SYSTEME AUDIO ---
let audioCtx = null;
function initAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); else if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e) {} }
function playSound(type) {
  if (!audioCtx) return;
  try {
    let now = audioCtx.currentTime; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'shoot') { osc.type='square'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(100,now+0.08); gain.gain.setValueAtTime(0.06,now); gain.gain.linearRampToValueAtTime(0.01,now+0.08); osc.start(now); osc.stop(now+0.08); }
    else if (type === 'explosion') { osc.type='sawtooth'; osc.frequency.setValueAtTime(140,now); osc.frequency.linearRampToValueAtTime(20,now+0.35); gain.gain.setValueAtTime(0.2,now); gain.gain.linearRampToValueAtTime(0.01,now+0.35); osc.start(now); osc.stop(now+0.35); }
    else if (type === 'hit') { osc.type='triangle'; osc.frequency.setValueAtTime(220,now); osc.frequency.linearRampToValueAtTime(70,now+0.06); gain.gain.setValueAtTime(0.1,now); gain.gain.linearRampToValueAtTime(0.01,now+0.06); osc.start(now); osc.stop(now+0.06); }
    else if (type === 'boss_spawn') { osc.type='sawtooth'; osc.frequency.setValueAtTime(80,now); osc.frequency.exponentialRampToValueAtTime(250,now+0.8); gain.gain.setValueAtTime(0.2,now); gain.gain.linearRampToValueAtTime(0.01,now+0.8); osc.start(now); osc.stop(now+0.8); }
    else if (type === 'portal') { osc.type='sine'; osc.frequency.setValueAtTime(150,now); osc.frequency.exponentialRampToValueAtTime(600,now+1.5); gain.gain.setValueAtTime(0.3,now); gain.gain.linearRampToValueAtTime(0.01,now+1.5); osc.start(now); osc.stop(now+1.5); }
    else if (type === 'powerup') { osc.type='sine'; osc.frequency.setValueAtTime(520,now); osc.frequency.exponentialRampToValueAtTime(1040,now+0.2); gain.gain.setValueAtTime(0.15,now); gain.gain.linearRampToValueAtTime(0.01,now+0.25); osc.start(now); osc.stop(now+0.25); }
  } catch(e) {}
}

// --- INITIALISATION DES CARTES ---
function initMapEnvironment(dim) {
  worldVersion++;
  baseCentral.w = dim===3?130: (dim===2?110:90); baseCentral.h = baseCentral.w;
  baseCentral.x = canvas.width/2 - baseCentral.w/2; baseCentral.y = canvas.height/2 - baseCentral.h/2;
  if (dim === 1) {
    maxWaves = 15; globalTime = 0;
    buildings = [ { x: canvas.width*0.15, y: canvas.height*0.15, w: 110, h: 85 }, { x: canvas.width*0.70, y: canvas.height*0.18, w: 120, h: 95 }, { x: canvas.width*0.20, y: canvas.height*0.72, w: 130, h: 100 }, { x: canvas.width*0.68, y: canvas.height*0.70, w: 100, h: 110 } ];
    scenery = [ { type: 'rock', x: canvas.width*0.08, y: canvas.height*0.45, r: 16 }, { type: 'rock', x: canvas.width*0.88, y: canvas.height*0.50, r: 12 }, { type: 'bush', x: canvas.width*0.45, y: canvas.height*0.12, r: 20 }, { type: 'bush', x: canvas.width*0.50, y: canvas.height*0.88, r: 25 }, { type: 'rock', x: canvas.width*0.38, y: canvas.height*0.40, r: 10 }, { type: 'bush', x: canvas.width*0.82, y: canvas.height*0.82, r: 18 } ];
  } else if (dim === 2) {
    maxWaves = 10;
    buildings = [ { x: canvas.width*0.12, y: canvas.height*0.18, w: 125, h: 90 }, { x: canvas.width*0.72, y: canvas.height*0.15, w: 115, h: 105 }, { x: canvas.width*0.16, y: canvas.height*0.70, w: 135, h: 95 }, { x: canvas.width*0.70, y: canvas.height*0.72, w: 120, h: 100 } ];
    scenery = [ { type: 'rock', x: canvas.width*0.07, y: canvas.height*0.48, r: 18 }, { type: 'rock', x: canvas.width*0.90, y: canvas.height*0.45, r: 15 }, { type: 'crystal', x: canvas.width*0.35, y: canvas.height*0.15, r: 22 }, { type: 'crystal', x: canvas.width*0.62, y: canvas.height*0.85, r: 24 }, { type: 'rock', x: canvas.width*0.32, y: canvas.height*0.62, r: 12 }, { type: 'crystal', x: canvas.width*0.84, y: canvas.height*0.84, r: 20 } ];
  } else if (dim === 3) {
    maxWaves = 5;
    buildings = [ { x: canvas.width*0.10, y: canvas.height*0.10, w: 140, h: 140 }, { x: canvas.width*0.75, y: canvas.height*0.75, w: 150, h: 150 }, { x: canvas.width*0.15, y: canvas.height*0.75, w: 120, h: 120 }, { x: canvas.width*0.75, y: canvas.height*0.15, w: 130, h: 130 } ];
    scenery = [ { type: 'magma', x: canvas.width*0.25, y: canvas.height*0.35, r: 35 }, { type: 'magma', x: canvas.width*0.8, y: canvas.height*0.55, r: 40 }, { type: 'rock', x: canvas.width*0.5, y: canvas.height*0.1, r: 25 }, { type: 'rock', x: canvas.width*0.4, y: canvas.height*0.85, r: 20 } ];
  } else if (dim === 4) { // Sandbox
    maxWaves = 999; buildings = []; scenery = [];
  }
}
initMapEnvironment(1);

function spawnParticles(x, y, color, count, speed) {
  if (particles.length > 200) particles.splice(0, count);
  for (let i = 0; i < count; i++) {
    let a = Math.random() * Math.PI * 2; let s = Math.random() * speed + 0.5;
    particles.push({ x: x, y: y, dx: Math.cos(a)*s, dy: Math.sin(a)*s, radius: Math.random()*3+1.5, color: color, alpha: 1, life: Math.random()*15+10 });
  }
}

// --- INPUTS ---
window.addEventListener('keydown', e => {
  if (!e.key) return; keys[e.key.toLowerCase()] = true;
  if (e.code === 'Escape' && (gameState === 'playing' || gameState === 'paused' || gameState === 'admin_sandbox')) {
    gameState = (gameState === 'paused') ? (currentDimension===4?'admin_sandbox':'playing') : 'paused';
  }
  if (e.code === 'Space' && (gameState === 'playing'||gameState === 'admin_sandbox') && player.dashCooldown <= 0 && !player.isDashing) {
    player.isDashing = true; player.dashTimer = 15; player.dashCooldown = CLASSES[player.color].dash; spawnParticles(player.x, player.y, '#38bdf8', 15, 5);
  }
  if (e.key.toLowerCase() === 'e' && (gameState === 'playing'||gameState === 'admin_sandbox')) {
    let w = ['pistol']; if (upgrades.shotgunLevel > 0 || gameState==='admin_sandbox') w.push('shotgun'); if (upgrades.rocketLevel > 0 || gameState==='admin_sandbox') w.push('rocket');
    player.currentWeapon = w[(w.indexOf(player.currentWeapon) + 1) % w.length];
  }
  // CORRECTIF : la touche de triche "P" (saut à la dernière vague) a été retirée du jeu normal.
});
window.addEventListener('keyup', e => { if(e.key) keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
window.addEventListener('mousedown', e => {
  initAudio(); const r = canvas.getBoundingClientRect(); let mx = e.clientX - r.left; let my = e.clientY - r.top;

  if (gameState === 'lobby') {
    let podX = Math.min(canvas.width*0.35, 400); let playW=240, playH=80, playX=canvas.width-playW-40, playY=canvas.height-playH-40;
    if (mx >= playX && mx <= playX+playW && my >= playY && my <= playY+playH) { gameState = 'playing'; resetGame(); return; }

    // ADMIN BUTTON
    if (mx >= 10 && mx <= 110 && my >= canvas.height - 50 && my <= canvas.height - 10) {
        let code = prompt("CODE ADMIN :"); if(code==="1234"||code==="admin") enterSandbox(); else if(code) alert("Code refusé."); return;
    }

    let skinColors = ['#4ade80', '#f87171', '#22d3ee'];
    for (let i = 0; i < 3; i++) { if (Math.hypot(mx - (podX-70 + i*70), my - (canvas.height*0.6+180)) <= 22) { player.color = skinColors[i]; try {localStorage.setItem('playerColor', player.color);}catch(e){} } }

    let upX = canvas.width - 450; if (upX < podX + 180) upX = podX + 180;
    let items = [ { key:'speed', cost:Math.floor(250*Math.pow(1.6,upgrades.speed)), max:5 }, { key:'hp', cost:Math.floor(300*Math.pow(1.6,upgrades.hp)), max:5 }, { key:'baseHP', cost:Math.floor(350*Math.pow(1.6,upgrades.baseHP)), max:5 }, { key:'damage', cost:Math.floor(400*Math.pow(1.7,upgrades.damage)), max:5 }, { key:'shotgunLevel', cost:Math.floor(800*Math.pow(2.0,upgrades.shotgunLevel)), max:3 }, { key:'rocketLevel', cost:Math.floor(1200*Math.pow(2.2,upgrades.rocketLevel)), max:3 } ];
    for (let i = 0; i < items.length; i++) {
      if (mx >= upX+260 && mx <= upX+370 && my >= 90+i*55+8 && my <= 90+i*55+42) {
        if (money >= items[i].cost && upgrades[items[i].key] < items[i].max) { money -= items[i].cost; upgrades[items[i].key]++; playSound('powerup'); try {localStorage.setItem('survivalMoney', money); localStorage.setItem(UPKEYS[items[i].key], upgrades[items[i].key]);}catch(e){} }
      }
    }
  }
  else if (gameState === 'admin_sandbox') {
    let pX = canvas.width - 220;
    if (mx >= pX) {
        let tools = ['shoot_toggle','clear','normal','sprinter','tank','sniper','charger','kamikaze','healer','summoner','burrower','boss1','boss2','boss3','lobby'];
        let y = 60;
        for(let t of tools) {
            if(my >= y && my <= y+30) {
                if(t==='shoot_toggle') sandboxMode = sandboxMode==='spawn'?'shoot':'spawn';
                else if(t==='clear') { enemies=[]; activeBoss=null; } else if(t==='lobby') gameState='lobby'; else { sandboxTool=t; sandboxMode='spawn'; } return;
            } y+=35;
        }
    } else { if(sandboxMode==='shoot') shoot(); else spawnAdminEnemy(mx, my, sandboxTool); }
  }
  else if (gameState === 'reward') {
    for (let i = 0; i < currentRewards.length; i++) { if (mx >= canvas.width/2 - 240 && mx <= canvas.width/2 + 240 && my >= 190+i*105 && my <= 280+i*105) { applyReward(currentRewards[i].id); currentWave++; setupWave(); gameState = 'playing'; break; } }
  }
  else if (gameState === 'gameover' || gameState === 'victory') {
    if (mx >= canvas.width/2 - 120 && mx <= canvas.width/2 + 120 && my >= canvas.height/2 + 140 && my <= canvas.height/2 + 200) gameState = 'lobby';
  }
  else if (gameState === 'paused') {
    let bx = canvas.width/2 - 100;
    if (mx >= bx && mx <= bx+200 && my >= canvas.height/2+20 && my <= canvas.height/2+70) gameState = currentDimension===4?'admin_sandbox':'playing';
    if (mx >= bx && mx <= bx+200 && my >= canvas.height/2+90 && my <= canvas.height/2+140) gameState = 'lobby';
  }
  else if (gameState === 'playing') { shoot(); }
});

function enterSandbox() {
    gameState = 'admin_sandbox'; currentDimension = 4; initMapEnvironment(4); portal.active = false; activeBoss = null;
    baseCentral.maxHp = 999999; baseCentral.hp = 999999; player.hp = 999999; player.x = canvas.width/2; player.y = canvas.height/2 + 150;
    enemies = []; bullets = []; enemyBullets = []; turrets = []; mines = []; barrels = []; powerups = [];
}
function spawnAdminEnemy(x, y, tool) {
    let t = tool, bd = 1; if(tool==='boss1'){t='boss';bd=1;} if(tool==='boss2'){t='boss';bd=2;} if(tool==='boss3'){t='boss';bd=3;}
    let eS = 0.8, eH = 15, r = 14, b = t==='boss'; let d = b?bd:1;
    if(b) { eH=200*bd; eS=bd===3?1.4:0.6; r=bd===3?55:42; }
    else { if(t==='sprinter'){eS=1.4;r=12;} else if(t==='tank'){eS=0.5;eH=45;r=24;} else if(t==='sniper'){eS=0.6;r=14;} else if(t==='healer'){eH=25;r=15;} else if(t==='kamikaze'){eS=1.8;r=12;} else if(t==='burrower'){eS=1.1;eH=20;r=16;} else if(t==='charger'){eS=1.0;eH=30;r=16;} else if(t==='summoner'){eS=0.4;eH=40;r=20;} }
    enemies.push({ id: ++enemyIdCounter, x:x, y:y, radius:r, speed:eS, hp:eH, maxHp:eH, type:t, shootCooldown:0, angle:0, walkCycle:0, dim:d, state:'normal', timer:0, isBoss:b, phase2:false });
    if (b) activeBoss = enemies[enemies.length-1];
}

function endGame(isV) {
  if(gameState==='admin_sandbox') { player.hp=999999; baseCentral.hp=999999; return; }
  gameState = isV?'victory':'gameover'; money += score; totalXP += score;
  try{localStorage.setItem('survivalMoney',money); localStorage.setItem('survivalXP',totalXP);}catch(e){}
  endGameTime = Date.now(); spawnEndParticles(gameState);
}

function setupWave() {
  enemiesSpawnedInWave = 0; activeBoss = null;
  if(currentWave%5===0) { enemiesTotalInWave = 1; waveTimer = 9999; }
  else { enemiesTotalInWave = (currentDimension===1?4:(currentDimension===2?6:9)) + (currentWave-1)*3; waveTimer = 0; }
  waveInProgress = true;
}

function enterDimension(dim) {
  playSound('portal'); triggerShake(25, 45); dimFlashAlpha = 1.0; currentDimension = dim; currentWave = 1; portal.active = false;
  initMapEnvironment(dim); baseCentral.maxHp = getBaseMaxHp(); baseCentral.hp = baseCentral.maxHp; player.x = canvas.width/2; player.y = canvas.height/2 + (dim===3?160:135); player.hp = getPlayerMaxHp();
  bullets=[]; enemyBullets=[]; enemies=[]; powerups=[]; barrels=[]; particles=[]; floatingTexts=[];
  for (let i = 0; i < turrets.length; i++) { let a = (i*Math.PI*2)/turrets.length; turrets[i].x = canvas.width/2 + Math.cos(a)*(baseCentral.w/2+25); turrets[i].y = canvas.height/2 + Math.sin(a)*(baseCentral.h/2+25); }
  spawnParticles(player.x, player.y, dim===3?'#facc15':'#c084fc', 50, 10); setupWave();
}

function openRewardSelection() {
  gameState = 'reward'; let aR = [];
  if (upgrades.turretLevel < 3) aR.push({ id:'turret', title:`🤖 Tourelle (Niv. ${upgrades.turretLevel+1}/3)`, desc:'Déploie/Améliore une tourelle.' });
  if (upgrades.mineLevel < 3) aR.push({ id:'mines', title:`💣 Mines (Niv. ${upgrades.mineLevel+1}/3)`, desc:'Déploie des mines.' });
  if (runPerks.vampirism < 3) aR.push({ id:'vampirism', title:`🦇 Vampirisme (Niv. ${runPerks.vampirism+1}/3)`, desc:'Soin probable par kill.' });
  if (runPerks.piercing < 3) aR.push({ id:'piercing', title:`🏹 Perforantes (Niv. ${runPerks.piercing+1}/3)`, desc:'Balles traversantes.' });
  if (runPerks.explosive < 3) aR.push({ id:'explosive', title:`🔥 Incendiaires (Niv. ${runPerks.explosive+1}/3)`, desc:'Explosions aux impacts.' });
  if (upgrades.hp < 5) aR.push({ id:'heal', title:`❤️ Soin & Santé+`, desc:'Soin total et Santé Max+.' });
  aR.push({ id:'overcharge', title:`⚡ Réparation d'Urgence`, desc:'Restaure PV Joueur et 50% Base.' });
  if (Math.random() < 0.4) aR.push({ id:'barrel_reward', title:`💥 Largage de Baril`, desc:'Explosif sur le terrain.' });
  aR.sort(() => Math.random()-0.5); currentRewards = aR.slice(0, 3);
  if (currentRewards.length === 0) { currentWave++; setupWave(); gameState = 'playing'; }
}

function applyReward(id) {
  playSound('powerup');
  if (id === 'turret') { upgrades.turretLevel++; if (upgrades.turretLevel === 3) { turrets.push({ x: player.x-20, y: player.y, range: 160, shootCooldown: 0, level: 3 }); turrets.push({ x: player.x+20, y: player.y, range: 160, shootCooldown: 0, level: 3 }); } else { turrets.push({ x: player.x, y: player.y, range: 140+(upgrades.turretLevel*10), shootCooldown: 0, level: upgrades.turretLevel }); } }
  else if (id === 'mines') { upgrades.mineLevel++; let c = upgrades.mineLevel===1?3:(upgrades.mineLevel===2?5:7); for(let i=0; i<c; i++) { let a=(i*Math.PI*2)/c; mines.push({ x:player.x+Math.cos(a)*45, y:player.y+Math.sin(a)*45, radius:10, level:upgrades.mineLevel }); } }
  else if (id === 'barrel_reward') { let a = Math.random()*Math.PI*2; let d = 50+Math.random()*50; barrels.push({ x:Math.max(30,Math.min(canvas.width-30,player.x+Math.cos(a)*d)), y:Math.max(30,Math.min(canvas.height-30,player.y+Math.sin(a)*d)), radius:13, hp:1 }); }
  else if (id === 'vampirism') runPerks.vampirism++; else if (id === 'piercing') runPerks.piercing++; else if (id === 'explosive') runPerks.explosive++;
  else if (id === 'heal') { upgrades.hp = Math.min(5, upgrades.hp+1); player.hp = getPlayerMaxHp(); baseCentral.maxHp = getBaseMaxHp(); baseCentral.hp = baseCentral.maxHp; try{localStorage.setItem(UPKEYS.hp, upgrades.hp);}catch(e){} }

function createExplosion(x, y, radius, damage) {
  playSound('explosion'); triggerShake(8, 15); spawnParticles(x, y, '#ffffff', 5, 8); spawnParticles(x, y, '#fb923c', 15, 6); spawnParticles(x, y, '#451a03', 15, 4);
  for (let j = enemies.length - 1; j >= 0; j--) {
    let e = enemies[j]; if (!e || e.state === 'burrowed') continue;
    if (Math.hypot(e.x - x, e.y - y) < e.radius + radius) { e.hp -= damage; addFloatingText(e.x, e.y, damage, '#facc15'); if (e.hp <= 0) { if (e.isBoss) activeBoss = null; enemies.splice(j, 1); addKillToCombo(); runStats.kills++; score += Math.round(5 * currentWave * currentDimension * getMultiplier()); } }
  }
  for (let b = barrels.length - 1; b >= 0; b--) { let bar = barrels[b]; if (Math.hypot(bar.x - x, bar.y - y) < bar.radius + radius && bar.hp > 0) { bar.hp = 0; createExplosion(bar.x, bar.y, 70, 5); } }
  if (Math.hypot(player.x - x, player.y - y) < player.radius + radius && !player.isDashing && player.shieldTimer <= 0) { player.hp -= 1; playSound('hit'); triggerShake(10, 20); spawnParticles(player.x, player.y, '#ef4444', 10, 4); if (player.hp <= 0) endGame(false); }
}

function shoot() {
  playSound('shoot'); player.recoil = 8; const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  let cClass = CLASSES[player.color] || CLASSES['#4ade80']; let bulletDamage = (1 + upgrades.damage) * cClass.dmg;
  const createB = (a, rad, dmg, col, maxD, pierce, isRck) => { runStats.shots++; return { id: ++bulletIdCounter, x: player.x, y: player.y, startX: player.x, startY: player.y, dx: Math.cos(a)*(isRck?5:12), dy: Math.sin(a)*(isRck?5:12), radius: rad, damage: dmg, color: col, maxDist: maxD, pierceLeft: pierce, hitList: [], isRocket: isRck, explosive: runPerks.explosive > 0, history: [] }; };
  if (player.currentWeapon === 'shotgun' && (upgrades.shotgunLevel > 0 || gameState === 'admin_sandbox')) { let sl = Math.max(1, upgrades.shotgunLevel); let c = 2+sl; let sp = 0.5; for (let i = 0; i < c; i++) { let off = c>1 ? -sp/2+(i*(sp/(c-1))) : 0; bullets.push(createB(angle+off, 3.5, bulletDamage+sl, '#fb923c', 200, runPerks.piercing, false)); } }
  else if (player.currentWeapon === 'rocket' && (upgrades.rocketLevel > 0 || gameState === 'admin_sandbox')) { bullets.push(createB(angle, 6, bulletDamage + Math.max(1, upgrades.rocketLevel)*2, '#f97316', Infinity, 0, true)); }
  else { bullets.push(createB(angle, 4+(upgrades.damage*0.5), bulletDamage, '#facc15', Infinity, runPerks.piercing, false)); }

function spawnEnemy() {
  let x, y; if (Math.random() < 0.5) { x = Math.random()<0.5?-20:canvas.width+20; y = Math.random()*canvas.height; } else { x = Math.random()*canvas.width; y = Math.random()<0.5?-20:canvas.height+20; }
  let hpMult = currentDimension===1 ? 1 : (currentDimension===2 ? 2.5 : 5.0);
  let spdMult = currentDimension===1 ? 1 : (currentDimension===2 ? 1.15 : 1.35);

  if (currentWave % 5 === 0 && enemiesSpawnedInWave === 0) {
    playSound('boss_spawn'); let bossHp = Math.round((40+(currentWave*20))*hpMult); if(currentDimension===3) bossHp += 1500;
    enemies.push({ id: ++enemyIdCounter, x: canvas.width/2, y: -80, radius: currentDimension===3?55:42, speed: currentDimension===3?1.4:0.6*spdMult, hp: bossHp, maxHp: bossHp, type: 'boss', shootCooldown: 0, isBoss: true, angle: 0, walkCycle: 0, dim: currentDimension, phase2: false });
    activeBoss = enemies[enemies.length-1]; enemiesSpawnedInWave++; return;
  }

  // CORRECTIF : ajout du Guérisseur et du Foreur au tirage normal
  let rand = Math.random(); let t = 'normal'; let eS = (0.8+(currentWave*0.07))*spdMult; let eH = Math.round((1+Math.floor((currentWave-1)/3))*hpMult); let r = 14;
  if (currentWave >= 2 && rand < 0.18) { t = 'sprinter'; eS *= 1.75; eH = Math.max(1, Math.round(eH*0.7)); r = 12; }
  else if (currentWave >= 4 && rand >= 0.18 && rand < 0.30) { t = 'tank'; eS *= 0.55; eH *= 3; r = 24; }
  else if (currentWave >= 3 && rand >= 0.30 && rand < 0.45) { t = 'sniper'; eS *= 0.65; eH = Math.max(1, Math.round(eH*0.8)); r = 14; }
  else if (currentWave >= 5 && rand >= 0.45 && rand < 0.57) { t = 'charger'; eS *= 1.1; eH *= 2; r = 16; }
  else if (currentWave >= 6 && rand >= 0.57 && rand < 0.69) { t = 'kamikaze'; eS *= 2.0; eH = 1; r = 12; }
  else if (currentWave >= 6 && rand >= 0.69 && rand < 0.79) { t = 'burrower'; eS *= 1.1; eH = Math.max(1, Math.round(eH*1.3)); r = 16; }
  else if (currentWave >= 8 && rand >= 0.79 && rand < 0.89) { t = 'healer'; eS *= 0.7; eH *= 2; r = 15; }
  else if (currentWave >= 7 && rand >= 0.89) { t = 'summoner'; eS *= 0.4; eH *= 1.5; r = 20; }

  enemies.push({ id: ++enemyIdCounter, x: x, y: y, radius: r, speed: eS, hp: eH, maxHp: eH, type: t, shootCooldown: 0, angle: 0, walkCycle: Math.random()*Math.PI*2, dim: currentDimension, state: 'normal', timer: 0 });
  enemiesSpawnedInWave++;
}

function resetGame() {
  currentDimension = 1; portal.active = false; dimFlashAlpha = 0; globalTime = 0; frameCount = 0; runStats = { shots: 0, hits: 0, kills: 0, crits: 0 };
  initMapEnvironment(1); baseCentral.maxHp = getBaseMaxHp(); baseCentral.hp = baseCentral.maxHp;
  player.x = canvas.width / 2; player.y = canvas.height / 2 + 120; player.hp = getPlayerMaxHp();
  bullets = []; enemyBullets = []; enemies = []; powerups = []; turrets = []; mines = []; barrels = []; particles = []; floatingTexts = [];
  score = 0; currentWave = 1; activeBoss = null; setupWave();
  player.dashCooldown = 0; player.isDashing = false; player.dashTimer = 0; player.shieldTimer = 0; player.currentWeapon = 'pistol'; player.recoil = 0; player.walkCycle = 0;
  comboCount = 0; comboTimer = 0; runPerks = { vampirism: 0, piercing: 0, explosive: 0 }; upgrades.turretLevel = 0; upgrades.mineLevel = 0;

function checkRectCollision(c, r) { let cX = Math.max(r.x, Math.min(c.x, r.x+r.w)); let cY = Math.max(r.y, Math.min(c.y, r.y+r.h)); return Math.hypot(c.x-cX, c.y-cY) < c.radius; }

function getSteeredPosition(e, tX, tY) {
  let dA = Math.atan2(tY - e.y, tX - e.x); let testX = e.x + Math.cos(dA)*e.speed; let testY = e.y + Math.sin(dA)*e.speed;
  let tC = { x: testX, y: testY, radius: e.radius+4 }; let c = false;
  for (let b of buildings) if (checkRectCollision(tC, b)) { c = true; break; }
  if (!c) { for (let s of scenery) if (s.type==='rock' && Math.hypot(s.x-testX, s.y-testY) < s.r+e.radius+4) { c = true; break; } }
  if (!c) return { x: testX, y: testY, angle: dA };
  let alts = [0.4, -0.4, 0.8, -0.8, 1.2, -1.2, 1.57, -1.57];
  for (let off of alts) {
    let aA = dA + off; let aX = e.x + Math.cos(aA)*e.speed; let aY = e.y + Math.sin(aA)*e.speed; let aC = { x: aX, y: aY, radius: e.radius+2 }; let ac = false;
    for (let b of buildings) if (checkRectCollision(aC, b)) { ac = true; break; }
    if (!ac) { for (let s of scenery) if (s.type==='rock' && Math.hypot(s.x-aX, s.y-aY) < s.r+e.radius+2) { ac = true; break; } }
    if (!ac) return { x: aX, y: aY, angle: aA };
  }
  return { x: e.x, y: e.y, angle: dA };
}

function update() {
  if (gameState !== 'playing' && gameState !== 'admin_sandbox') return;
  frameCount++;
  if (currentDimension === 1 || currentDimension === 2) globalTime += 1.5;
  // CORRECTIF : soin passif de l'Ingénieur basé sur un compteur dédié (marche aussi pendant les boss)
  if (player.color === '#22d3ee' && frameCount % 60 === 0 && baseCentral.hp < baseCentral.maxHp) { baseCentral.hp = Math.min(baseCentral.maxHp, baseCentral.hp + 2); spawnParticles(baseCentral.x+baseCentral.w/2, baseCentral.y+baseCentral.h/2, '#4ade80', 2, 1); }
  if (dimFlashAlpha > 0) dimFlashAlpha = Math.max(0, dimFlashAlpha - 0.02);
  if (player.dashCooldown > 0) player.dashCooldown--; if (player.shieldTimer > 0) player.shieldTimer--; if (player.recoil > 0) player.recoil -= 0.5;
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }

  let currentSpeed = getPlayerSpeed();
  if (player.isDashing) { currentSpeed *= 3.5; player.dashTimer--; if (player.dashTimer % 2 === 0) spawnParticles(player.x, player.y, player.color, 1, 0); if (player.dashTimer <= 0) player.isDashing = false; }

  for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.dx; p.y += p.dy; p.alpha -= 1 / p.life; if (p.alpha <= 0) particles.splice(i, 1); }
  for (let i = floatingTexts.length - 1; i >= 0; i--) { let ft = floatingTexts[i]; ft.y += ft.dy; ft.life--; if (ft.life <= 0) floatingTexts.splice(i, 1); }

  if (waveInProgress && gameState !== 'admin_sandbox') {
    waveTimer++; let spawnInterval = currentWave % 5 === 0 ? 9999 : Math.max(20, 70 - (currentWave * 3));
    if (waveTimer > spawnInterval && enemiesSpawnedInWave < enemiesTotalInWave) { spawnEnemy(); waveTimer = 0; }
    if (enemiesSpawnedInWave >= enemiesTotalInWave && enemies.length === 0) {
      if (currentWave >= maxWaves) {
        if (currentDimension < 3) { waveInProgress = false; portal.active = true; portal.targetDim = currentDimension + 1; portal.x = canvas.width / 2; portal.y = Math.max(120, canvas.height * 0.22); playSound('portal'); triggerShake(15, 30); }
        else { endGame(true); }
      } else { waveInProgress = false; openRewardSelection(); }
    }
  }

  if (portal.active) {
    let pColor = portal.targetDim === 2 ? '#d946ef' : '#facc15';
    if (Math.random() < 0.6) spawnParticles(portal.x + (Math.random()-0.5)*80, portal.y + (Math.random()-0.5)*80, pColor, 1, 3);
    if (Math.hypot(player.x - portal.x, player.y - portal.y) < player.radius + portal.radius) { enterDimension(portal.targetDim); return; }
  }

  let nextX = player.x; let nextY = player.y; let isMoving = false;
  if (keys['z'] || keys['arrowup'] || keys['w']) { nextY -= currentSpeed; isMoving = true; }
  if (keys['s'] || keys['arrowdown']) { nextY += currentSpeed; isMoving = true; }
  if (keys['q'] || keys['arrowleft'] || keys['a']) { nextX -= currentSpeed; isMoving = true; }
  if (keys['d'] || keys['arrowright']) { nextX += currentSpeed; isMoving = true; }
  nextX = Math.max(player.radius, Math.min(canvas.width - player.radius, nextX)); nextY = Math.max(player.radius, Math.min(canvas.height - player.radius, nextY));
  if(isMoving && !player.isDashing) { if(!player.walkCycle) player.walkCycle = 0; player.walkCycle += 0.2; } else { player.walkCycle = 0; }

  let playerCollides = false; let testPlayer = { x: nextX, y: nextY, radius: player.radius };
  for (let b of buildings) { if (checkRectCollision(testPlayer, b)) { playerCollides = true; break; } }
  if (!playerCollides) { player.x = nextX; player.y = nextY; }

  for (let t of turrets) {
    t.shootCooldown++; let fireRate = t.level === 1 ? 65 : (t.level === 2 ? 45 : 30); let turretDmg = 1 + Math.floor(upgrades.damage * 0.4);
    let closestEnemy = null; let minDist = t.range;
    for (let e of enemies) { if(e.state === 'burrowed') continue; let dist = Math.hypot(e.x - t.x, e.y - t.y); if (dist < minDist) { minDist = dist; closestEnemy = e; } }
    if (closestEnemy && t.shootCooldown > fireRate) { t.shootCooldown = 0; let angle = Math.atan2(closestEnemy.y - t.y, closestEnemy.x - t.x); bullets.push({ id: ++bulletIdCounter, x: t.x, y: t.y, startX: t.x, startY: t.y, dx: Math.cos(angle) * 12, dy: Math.sin(angle) * 12, radius: 3, damage: turretDmg, color: '#22d3ee', maxDist: t.range, pierceLeft: 0, hitList: [], history: [] }); }
  }

  for (let i = mines.length - 1; i >= 0; i--) {
    let m = mines[i]; let exploded = false; let mineDmg = 3 + upgrades.damage + (m.level > 1 ? m.level * 2 : 0);
    for (let j = enemies.length - 1; j >= 0; j--) { let e = enemies[j]; if(e.state === 'burrowed') continue; if (Math.hypot(e.x - m.x, e.y - m.y) < e.radius + m.radius + 10) { createExplosion(m.x, m.y, 60, mineDmg); exploded = true; break; } }
    if (exploded) mines.splice(i, 1);
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    let p = powerups[i]; p.y += Math.sin(Date.now() * 0.005) * 0.2;
    if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) { playSound('powerup'); if (p.type === 'heal') { player.hp = Math.min(getPlayerMaxHp(), player.hp + 35); baseCentral.hp = Math.min(baseCentral.maxHp, baseCentral.hp + 50); } else if (p.type === 'shield') player.shieldTimer = 300; powerups.splice(i, 1); }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i]; b.history.push({x: b.x, y: b.y}); if (b.history.length > (b.isRocket ? 15 : 6)) b.history.shift(); b.x += b.dx; b.y += b.dy;
    if (b.isRocket) spawnParticles(b.x, b.y, '#f97316', 1, 0.5);
    let hitBuilding = false;
    for (let building of buildings) { if (b.x >= building.x && b.x <= building.x + building.w && b.y >= building.y && b.y <= building.y + building.h) { hitBuilding = true; spawnParticles(b.x, b.y, '#888', 4, 3); break; } }
    for (let bar of barrels) { if (bar.hp > 0 && Math.hypot(b.x - bar.x, b.y - bar.y) < b.radius + bar.radius) { bar.hp = 0; createExplosion(bar.x, bar.y, 70, 5); hitBuilding = true; break; } }
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || hitBuilding || Math.hypot(b.x - b.startX, b.y - b.startY) > b.maxDist) { if (b.isRocket) createExplosion(b.x, b.y, 50, b.damage); bullets.splice(i, 1); continue; }
  }

  let enemyDmgMult = currentDimension === 1 ? 1.0 : (currentDimension === 2 ? 2.2 : 4.0);

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    let eb = enemyBullets[i]; if(!eb.history) eb.history = []; eb.history.push({x: eb.x, y: eb.y}); if (eb.history.length > 6) eb.history.shift();
    eb.x += eb.dx; eb.y += eb.dy;
    // CORRECTIF : les balles renvoyées (alliées) ne touchent plus le joueur
    if (!eb.isFriendly && Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + eb.radius && !player.isDashing && player.shieldTimer <= 0) {
        let dmg = 1.2 * enemyDmgMult;
        if(player.color === '#f87171') {
            spawnParticles(player.x, player.y, '#f87171', 5, 4);
            // la balle renvoyée part un peu devant le joueur, dans la direction opposée
            enemyBullets.push({ x: player.x - eb.dx * 3, y: player.y - eb.dy * 3, dx: -eb.dx, dy: -eb.dy, radius: 4, color: '#f87171', history: [], isFriendly: true });
        }
        player.hp -= dmg; playSound('hit'); triggerShake(6, 12); spawnParticles(player.x, player.y, '#ef4444', 8, 4); enemyBullets.splice(i, 1);
        if (player.hp <= 0) { if (gameState==='admin_sandbox') player.hp = getPlayerMaxHp(); else endGame(false); } continue;
    }
    if (eb.isFriendly) {
        let hitE = false;
        for(let e of enemies) {
            if (Math.hypot(e.x - eb.x, e.y - eb.y) < e.radius + eb.radius && e.state !== 'burrowed') {
                e.hp -= 2; hitE = true; spawnParticles(eb.x, eb.y, '#f87171', 4, 3); addFloatingText(e.x, e.y, "2", '#f87171');
                if(e.hp<=0) { if (e.isBoss) activeBoss = null; enemies.splice(enemies.indexOf(e),1); addKillToCombo(); runStats.kills++; score += 10; } break;
            }
        }
        if(hitE) { enemyBullets.splice(i,1); continue; }
    }
    if (!eb.isFriendly && eb.x >= baseCentral.x && eb.x <= baseCentral.x + baseCentral.w && eb.y >= baseCentral.y && eb.y <= baseCentral.y + baseCentral.h) { baseCentral.hp -= 1.8 * enemyDmgMult; playSound('hit'); triggerShake(5, 8); spawnParticles(eb.x, eb.y, '#0284c7', 6, 3); enemyBullets.splice(i, 1); if (baseCentral.hp <= 0) { if(gameState==='admin_sandbox') baseCentral.hp=baseCentral.maxHp; else endGame(false); } continue; }
    if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) { enemyBullets.splice(i, 1); }
  }

  let baseCenterX = baseCentral.x + baseCentral.w / 2; let baseCenterY = baseCentral.y + baseCentral.h / 2;
  for (let i = enemies.length - 1; i >= 0; i--) {
    // CORRECTIF : une explosion peut avoir retiré plusieurs ennemis, l'index peut être hors limites
    let e = enemies[i]; if (!e) continue;
    let distPlayer = Math.hypot(player.x - e.x, player.y - e.y); let targetX = baseCenterX; let targetY = baseCenterY;
    if (distPlayer < 250 || e.dim === 3 || e.type === 'kamikaze') { targetX = player.x; targetY = player.y; }

    e.walkCycle += e.speed * 0.3;

    if (e.isBoss && e.hp < e.maxHp / 2 && !e.phase2) { e.phase2 = true; e.speed *= 1.4; triggerShake(15, 30); playSound('boss_spawn'); spawnParticles(e.x, e.y, '#ffffff', 40, 8); }

    if (e.type === 'healer') {
      if(!e.timer) e.timer=0; e.timer++;
      if (e.timer > 90) { e.timer = 0; for(let other of enemies) { if (other !== e && Math.hypot(e.x - other.x, e.y - other.y) < 150) { other.hp = Math.min(other.maxHp, other.hp + 5); spawnParticles(other.x, other.y, '#22c55e', 3, 1); } } spawnParticles(e.x, e.y, '#4ade80', 10, 4); }
    }
    else if (e.type === 'kamikaze') {
      // CORRECTIF : on retire le kamikaze AVANT l'explosion pour ne pas supprimer le mauvais ennemi
      if (distPlayer < 40) { enemies.splice(i, 1); createExplosion(e.x, e.y, 60, 2 * enemyDmgMult); continue; }
    }
    else if (e.type === 'burrower') {
      if(!e.timer) e.timer=0; e.timer++;
      if (e.state === 'normal' && e.timer > 120 && distPlayer > 100) { e.state = 'burrowed'; e.timer = 0; spawnParticles(e.x, e.y, '#451a03', 10, 2); }
      if (e.state === 'burrowed') { spawnParticles(e.x, e.y, '#451a03', 1, 0.5); if (distPlayer < 60 || e.timer > 200) { e.state = 'normal'; e.timer = 0; spawnParticles(e.x, e.y, '#78350f', 15, 3); } }
    }
    else if (e.type === 'charger') {
       let angleToPlayer = Math.atan2(targetY - e.y, targetX - e.x); let diff = Math.abs(e.angle - angleToPlayer); if (diff > Math.PI) diff = 2*Math.PI - diff;
       if (diff < 0.2 && distPlayer < 300) { e.speed = 2.5 * enemyDmgMult; spawnParticles(e.x, e.y, '#facc15', 1, 1); } else { e.speed = 0.8 * enemyDmgMult; }
    }
    else if (e.type === 'summoner') {
       e.speed = 0.4 * enemyDmgMult; if(!e.timer) e.timer=0; e.timer++;
       if (e.timer > 180) { e.timer = 0; enemies.push({ id: ++enemyIdCounter, x: e.x, y: e.y, radius: 10, speed: 1.5*enemyDmgMult, hp: 1, maxHp: 1, type: 'normal', shootCooldown: 0, angle: 0, walkCycle: 0, dim: e.dim, state: 'normal', timer: 0, isBoss:false, phase2:false }); spawnParticles(e.x, e.y, '#a855f7', 15, 3); }
    }

    if (e.isBoss) {
      e.shootCooldown++; let bossFireRate = e.dim === 1 ? 110 : (e.dim === 2 ? 80 : 45); if (e.phase2) bossFireRate *= 0.6;
      if (e.shootCooldown > bossFireRate) {
        e.shootCooldown = 0; playSound('boss_spawn'); let ringCount = e.dim === 1 ? 14 : (e.dim === 2 ? 18 : 24);
        let bulColor = e.phase2 ? '#ef4444' : (e.dim === 1 ? '#e879f9' : (e.dim === 2 ? '#22d3ee' : '#facc15'));
        for (let r = 0; r < ringCount; r++) { let ra = (r * Math.PI * 2) / ringCount + (e.walkCycle * 0.2); enemyBullets.push({ x: e.x, y: e.y, dx: Math.cos(ra) * (3 + e.dim), dy: Math.sin(ra) * (3 + e.dim), radius: 5 + e.dim, color: bulColor, history: [] }); }
      }
    }
    else if (e.type === 'sniper' && Math.hypot(targetX - e.x, targetY - e.y) < (350 + e.dim*50)) {

function shadeHex(hex, amt) {
  let n = parseInt(hex.slice(1), 16);
  let r = Math.max(0, Math.min(255, (n >> 16) + amt)), g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt)), b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function oval(x, y, rx, ry, col, rot) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2); ctx.fill(); }
function circ(x, y, r, col) { oval(x, y, r, r, col); }
function rrect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); ctx.fill(); }
function limb(pts, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke(); }
let glowOn = true;
function glow(col, blur) { if (!glowOn) return; ctx.shadowColor = col; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }

// Palettes des 3 classes

  '#22d3ee': { skin: '#c98e6a', boot: '#44331f', pants: '#334155', body: '#1e3a4a', body2: '#12242e', accent: '#22d3ee', gear: '#475569' }  // Ingénieur
};

// 🧍 JOUEUR VU DE DESSUS (en jeu) — repère local : regarde vers +x
// =====================================================
function drawPlayerTopDown() {
  let pr = player.radius, S = HERO_STYLE[player.color] || HERO_STYLE['#4ade80'];
  let isTank = player.color === '#f87171', isEng = player.color === '#22d3ee';
  let wc = player.walkCycle || 0, rec = player.recoil * 0.5, t = Date.now();
  let stride = Math.sin(wc) * pr * 0.5, gy = pr * 0.2;
  let bw = isTank ? 1.2 : (isEng ? 1.02 : 0.9);
  let shY = pr * bw * 0.62;

  // Bottes (alternent pendant la marche)
  oval(pr * 0.05 + stride, -pr * 0.3, pr * 0.36, pr * 0.2, S.boot);
  oval(pr * 0.05 - stride, pr * 0.3, pr * 0.36, pr * 0.2, S.boot);

  // Équipement dorsal
  if (isTank) {
    rrect(-pr * 1.1, -pr * 0.6, pr * 0.6, pr * 1.2, 4, S.gear);
    rrect(-pr * 1.02, -pr * 0.5, pr * 0.44, pr * 0.42, 2, '#52525b');
    rrect(-pr * 1.02, pr * 0.08, pr * 0.44, pr * 0.42, 2, '#52525b');
    limb([-pr * 0.6, pr * 0.3, pr * 0.2, pr * 0.6], 2.5, '#ca8a04'); // bande de munitions
  } else if (isEng) {
    rrect(-pr * 1.15, -pr * 0.62, pr * 0.66, pr * 1.24, 5, S.gear);
    rrect(-pr * 1.06, -pr * 0.5, pr * 0.48, pr * 0.42, 2, '#334155');
    limb([-pr * 1.0, -pr * 0.15, -pr * 0.6, pr * 0.4], 3, '#9ca3af'); circ(-pr * 1.0, -pr * 0.15, 3.2, '#9ca3af'); circ(-pr * 1.0, -pr * 0.15, 1.4, S.gear); // clé à molette
    limb([-pr * 0.95, pr * 0.45, -pr * 1.7, pr * 0.95], 1.5, '#94a3b8'); // antenne
    let on = Math.floor(t / 400) % 2 === 0; if (on) glow('#22d3ee', 8); circ(-pr * 1.7, pr * 0.95, 2.2, on ? '#67e8f9' : '#0e7490'); noGlow();
  } else {
    rrect(-pr * 0.98, -pr * 0.42, pr * 0.48, pr * 0.84, 5, '#3f4d26');
    rrect(-pr * 0.92, -pr * 0.22, pr * 0.2, pr * 0.44, 2, S.gear);
    let s = t * 0.008; ctx.strokeStyle = S.accent; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; // écharpe au vent
    ctx.beginPath(); ctx.moveTo(-pr * 0.15, -pr * 0.15); ctx.quadraticCurveTo(-pr * 0.9, -pr * 0.3 + Math.sin(s) * 3, -pr * 1.55, -pr * 0.2 + Math.sin(s + 1.6) * 4); ctx.stroke();
  }

  // Torse
  let tg = ctx.createLinearGradient(0, -shY * 1.3, 0, shY * 1.3); tg.addColorStop(0, S.body2); tg.addColorStop(0.5, S.body); tg.addColorStop(1, S.body2);
  ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(-pr * 0.08, 0, pr * 0.55, shY * 1.28, 0, 0, Math.PI * 2); ctx.fill();
  if (isTank) {
    ctx.strokeStyle = '#450a0a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-pr * 0.55, -shY * 0.45); ctx.lineTo(pr * 0.4, -shY * 0.45); ctx.moveTo(-pr * 0.55, shY * 0.45); ctx.lineTo(pr * 0.4, shY * 0.45); ctx.stroke();
  } else if (isEng) {
    oval(-pr * 0.05, 0, pr * 0.42, shY * 1.1, '#ea8c00'); // gilet haute visibilité
    limb([-pr * 0.35, -shY * 0.9, -pr * 0.35, shY * 0.9], 2, '#e2e8f0'); limb([pr * 0.05, -shY * 0.95, pr * 0.05, shY * 0.95], 2, S.accent);
    rrect(pr * 0.12, -shY * 0.6, pr * 0.2, pr * 0.3, 1.5, '#9a5b00'); rrect(pr * 0.12, shY * 0.3, pr * 0.2, pr * 0.3, 1.5, '#9a5b00');
  } else {
    oval(-pr * 0.3, -shY * 0.5, pr * 0.16, pr * 0.1, S.body2, 0.5); oval(pr * 0.1, shY * 0.6, pr * 0.14, pr * 0.09, S.gear, -0.4); oval(-pr * 0.15, shY * 0.2, pr * 0.12, pr * 0.08, '#6b7b45', 0.2); // camouflage
    limb([-pr * 0.5, -shY * 0.9, pr * 0.35, shY * 0.9], 2, S.gear); limb([-pr * 0.5, shY * 0.9, pr * 0.35, -shY * 0.9], 2, S.gear); // harnais
  }

  // Arme
  let wpn = player.currentWeapon, rear, front;
  ctx.save(); ctx.translate(-rec, 0);
  if (wpn === 'shotgun') {
    rrect(pr * 0.05, gy - 3, pr * 0.6, 6, 2, '#7c4a1e');   // crosse en bois
    rrect(pr * 0.62, gy - 3.5, pr * 0.5, 7, 2, '#27272a'); // carcasse
    rrect(pr * 1.1, gy - 2, pr * 1.05, 4, 1, '#3f3f46');   // canon
    rrect(pr * 1.3, gy - 4, pr * 0.5, 8, 3, '#5b3714');    // pompe
    rear = [pr * 0.7, gy + 1]; front = [pr * 1.5, gy];
  } else if (wpn === 'rocket') {
    let rg = ctx.createLinearGradient(0, gy - 5, 0, gy + 7); rg.addColorStop(0, '#65a30d'); rg.addColorStop(1, '#365314');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(-pr * 0.6, gy - 4, pr * 2.85, 11, 4); ctx.fill();
    rrect(pr * 2.1, gy - 5, 4, 13, 1, '#1c1917'); rrect(-pr * 0.65, gy - 5, 4, 13, 1, '#1c1917');
    rrect(pr * 0.35, gy + 6, 5, 6, 1, '#27272a'); rrect(pr * 0.7, gy - 7, 8, 4, 1, '#18181b');
    rear = [pr * 0.45, gy + 6]; front = [pr * 1.2, gy + 5];
  } else {
    rrect(pr * 0.85, gy - 2.5, 14, 5, 1.5, '#1f2937'); rrect(pr * 0.85, gy - 2.5, 14, 2, 1, '#6b7280'); rrect(pr * 0.85 + 12, gy - 1.5, 3, 3, 1, '#0a0a0a');
    rear = [pr * 0.88, gy + 2]; front = [pr * 0.95, gy - 2];
  }
  ctx.restore();
  rear = [rear[0] - rec, rear[1]]; front = [front[0] - rec, front[1]];

  // Bras et mains
  let armW = isTank ? 7.5 : 6;
  limb([0, -shY, front[0] * 0.5, -shY * 0.75, front[0], front[1]], armW, S.body);
  limb([0, shY, rear[0] * 0.5, shY * 0.85, rear[0], rear[1]], armW, S.body);
  let glove = isTank ? '#3f3f46' : (isEng ? '#a16207' : S.boot);
  circ(front[0], front[1], armW * 0.55, glove); circ(rear[0], rear[1], armW * 0.55, glove);

  // Épaulières blindées du Tank (par-dessus les bras)
  if (isTank) {
    for (let sgn of [-1, 1]) {
      let pg = ctx.createRadialGradient(-pr * 0.1, sgn * shY * 1.05 - 2, 1, -pr * 0.05, sgn * shY * 1.05, pr * 0.45);
      pg.addColorStop(0, '#d4d4d8'); pg.addColorStop(1, '#52525b');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(-pr * 0.05, sgn * shY * 1.05, pr * 0.48, pr * 0.36, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = S.accent; ctx.lineWidth = 1.8; ctx.stroke();
    }
  }

  // Tête
  let hx = pr * 0.05, hr = pr * 0.47;
  if (isTank) {
    let hg = ctx.createRadialGradient(hx - 2, -2, 1, hx, 0, hr * 1.1); hg.addColorStop(0, '#9ca3af'); hg.addColorStop(1, '#3f3f46');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, 0, hr * 1.08, 0, Math.PI * 2); ctx.fill();
    rrect(hx - hr, -1.5, hr * 2, 3, 1.5, S.accent);
    ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.arc(hx, 0, hr * 1.08, -0.9, 0.9); ctx.lineTo(hx + hr * 0.5, 0); ctx.closePath(); ctx.fill();
    glow('#ef4444', 8); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(hx, 0, hr * 0.9, -0.55, 0.55); ctx.stroke(); noGlow();
  } else if (isEng) {
    ctx.fillStyle = 'rgba(165, 243, 252, 0.10)'; ctx.beginPath(); ctx.moveTo(hx + hr, 0); ctx.lineTo(hx + hr * 6, -hr * 2.2); ctx.lineTo(hx + hr * 6, hr * 2.2); ctx.closePath(); ctx.fill(); // faisceau de la lampe
    oval(hx + pr * 0.08, 0, hr * 1.25, hr * 1.15, '#ca8a04'); // bord du casque
    let hg = ctx.createRadialGradient(hx - 2, -2, 1, hx, 0, hr); hg.addColorStop(0, '#fef08a'); hg.addColorStop(1, '#eab308');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, 0, hr, 0, Math.PI * 2); ctx.fill();
    limb([hx - hr * 0.8, 0, hx + hr * 0.8, 0], 2, '#ca8a04');
    glow('#22d3ee', 8); circ(hx + hr * 1.05, 0, 2.5, '#a5f3fc'); noGlow();
  } else {
    circ(hx, 0, hr * 1.05, '#3f5a2a'); // capuche
    oval(hx - hr * 0.3, 0, hr * 0.6, hr * 0.9, '#344a22');
    rrect(hx + hr * 0.45, -hr * 0.75, hr * 0.4, hr * 1.5, 1, '#1f2937'); // lunettes
    glow(S.accent, 6); circ(hx + hr * 0.68, -hr * 0.4, hr * 0.17, '#86efac'); circ(hx + hr * 0.68, hr * 0.4, hr * 0.17, '#86efac'); noGlow();
  }
}

function drawLobbyHero(cx, cy) {
  let S = HERO_STYLE[player.color] || HERO_STYLE['#4ade80'];
  let isTank = player.color === '#f87171', isEng = player.color === '#22d3ee';
  let t = Date.now(), breathY = Math.sin(t * 0.003) * 4;
  ctx.save(); ctx.translate(cx, cy - 20);
  oval(0, 105, isTank ? 48 : 36, 12, 'rgba(0,0,0,0.6)');
  ctx.translate(0, breathY);
  let k = isTank ? 1.22 : (isEng ? 1.05 : 0.95);
  let metal = (y0, y1) => { let g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#d4d4d8'); g.addColorStop(1, '#52525b'); return g; };

  // ---- Jambes ----
  let lw = 17 * k;
  for (let x of [-lw - 2, 2]) {
    rrect(x, 18, lw, 52, 5, S.pants); rrect(x, 18, lw * 0.35, 52, 4, shadeHex(S.pants, -18));
    if (isTank) { ctx.fillStyle = metal(40, 64); ctx.beginPath(); ctx.roundRect(x + 1, 40, lw - 2, 24, 4); ctx.fill(); circ(x + lw / 2, 42, 4.5, S.accent); }
    else if (isEng) { rrect(x + 2, 44, lw - 4, 10, 3, '#1f2937'); rrect(x + lw * 0.15, 28, lw * 0.7, 10, 2, shadeHex(S.pants, -25)); }

    if (ctx) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px system-ui';
        ctx.fillText("❌ ERREUR CRITIQUE DANS LA BOUCLE : " + error.message, 50, 60);
    }
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
